<div
  class="ui-field"
  [class.ui-field--invalid]="!!getErrorMessage()"
  [class.ui-field--dynamic]="subscriptSizing === 'dynamic'"
>
  <fieldset class="ui-field__control date-field__control">
    @if (label) {
      <legend class="ui-field__label">
        {{ displayLabel }}
        <span *ngIf="showRequiredMarker" class="required-marker">*</span>
      </legend>
    }
    <input
      #dateInput
      class="ui-field__input date-field__input"
      [id]="controlName"
      type="date"
      [value]="nativeDateValue"
      [disabled]="controlDisabled"
      [attr.aria-label]="displayLabel || fieldPlaceholder"
      (change)="onDateChange($event)"
    />
    <button
      class="date-field__trigger"
      type="button"
      [disabled]="controlDisabled"
      [attr.aria-label]="'Abrir calendário de ' + (displayLabel || 'data')"
      (click)="openDatePicker()"
    >
      <ng-icon name="phosphorCalendar" aria-hidden="true" />
    </button>
  </fieldset>
  <div class="ui-field__error" role="alert">{{ getErrorMessage() }}</div>
</div>
