<div class="filters-base" (click)="onPanelClick($event)">
  <button class="filters-trigger" type="button" (click)="togglePanel($event)">
    <ng-icon name="phosphorFunnelSimple" aria-hidden="true" />
    <span>Filtros</span>

    @if (filtersCount() > 0) {
      <span class="filters-trigger__badge">{{ filtersCount() }}</span>
    }
  </button>

  @if (isPanelOpen()) {
    <section class="filters-panel" role="dialog">
      <header class="filters-panel__header">
        <h3>Filtros</h3>
        <button type="button" (click)="clearAll($event)">Limpar tudo</button>
      </header>

      <ng-content />
    </section>
  }
</div>
