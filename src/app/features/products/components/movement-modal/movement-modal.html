<div class="modal" *ngIf="open">
  <div class="dialog">
    <ng-container *ngIf="quick; else fullMovement">
      <h3>{{ type === 'ENTRADA' ? 'Comprar' : 'Vender' }} produto</h3>
      <app-text-field
        [formField]="quantityForm.quantity"
        label="Quantidade"
        [numericOnly]="true"
      ></app-text-field>
    </ng-container>
    <ng-template #fullMovement>
      <div class="dialog-head">
        <div>
          <span class="eyebrow">ESTOQUE</span>
          <h3>Registrar movimentação</h3>
        </div>
        <button class="close" (click)="cancelled.emit()">×</button>
      </div>
      <label>Produto<select [(ngModel)]="selectedProduct">
        <option value="" disabled>Selecione um produto</option>
        <option *ngFor="let item of products" [value]="item.id">{{ item.name }}</option>
      </select></label>
      <label>Tipo<select [(ngModel)]="type">
        <option value="ENTRADA">Entrada de estoque</option>
        <option value="SAIDA">Saída de estoque</option>
      </select></label>
    </ng-template>
    <label *ngIf="!quick">Quantidade<input type="number" [(ngModel)]="quantity" min="1" /></label>
    <footer>
      <button class="ghost secondary" (click)="cancelled.emit()">Cancelar</button>
      <button class="primary" (click)="confirm()">{{ quick ? 'Confirmar' : 'Salvar movimentação' }}</button>
    </footer>
  </div>
</div>
